name: "*** build ipa/tipa file ***"

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Use the standard Intel pool while arm64-hosted runners are capacity constrained.
    # All shipped iOS targets still build for arm64/arm64e via their existing flags.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            submodules: recursive

      - name: Merge and isolation integration regressions
        timeout-minutes: 10
        run: |
          set -euo pipefail
          {
            bash scripts/test-app-isolation.sh
            python3 scripts/test-update-contracts.py
            python3 tests/test-release-verifier.py
            python3 scripts/test-app-isolation-integration.py --sanitizer address
            python3 worker/test_configuration_cache.py --sanitizer address
            bash scripts/test-app-isolation-mach.sh
          } 2>&1 | tee app-isolation-tests.log

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          HOST_ARCH=$(uname -m)
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch $HOST_ARCH"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch $HOST_ARCH"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC date +'%Y%m%d_%H%M%S')
          TS=$(date -u +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          plutil -insert items.4 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>BUILDER</string></dict>" ./Application/Dopamine/UI/Settings/Credits.plist
          plutil -insert items.5 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>headerCellClass</key><string>DOCreditsCell</string><key>names</key><array><dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict></array></dict>" ./Application/Dopamine/UI/Settings/Credits.plist
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1 BUILD_TIMESTAMP="${{ env.ctimestamp }}"
          VERSION="("$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)-$(git rev-parse --short HEAD)")"-$(TZ=UTC git show -s --date=format-local:'%Y.%m.%d-%Z-%H.%M.%S' --format='%cd' HEAD)
          mv ./Application/Dopamine.ipa  "./Application/doimty-Dopamine-${VERSION}.ipa"
          mv ./Application/Dopamine.tipa "./Application/doimty-Dopamine-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Verify packaged identity and archives
        run: |
          set -euo pipefail
          python3 scripts/verify-release-package.py \
            --ipa "./Application/doimty-Dopamine-${{ env.version }}.ipa" \
            --tipa "./Application/doimty-Dopamine-${{ env.version }}.tipa" \
            --commit "${{ github.sha }}" \
            --output release-manifest.json

      - name: Upload app isolation regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-isolation-regressions
          path: app-isolation-tests.log
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-IPA
          path: Application/doimty-Dopamine-${{ env.version }}.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-TIPA
          path: Application/doimty-Dopamine-${{ env.version }}.tipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error